name: Browser fixture validation

on:
  push:
    branches: [fix/welcome-startup-app-once]

permissions:
  contents: read

concurrency:
  group: browser-fixture-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_SNAPSHOT: refresh
    steps:
      - name: Set browser runtime paths
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/prepare-ci-bubblewrap.sh
      - name: Install browser dependencies
        run: |
          sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i -E 's@http://([a-z]{2}\.)?archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g; s@http://security\.ubuntu\.com/ubuntu@https://security.ubuntu.com/ubuntu@g' {} +
          pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium webkit
      - name: Prepare research Python
        run: |
          python -m venv "$RUNNER_TEMP/research-browser-python"
          export DSH_RESEARCH_TEST_PYTHON="$RUNNER_TEMP/research-browser-python/bin/python"
          pnpm exec tsx -e 'import { execFileSync } from "node:child_process"; import { PLATFORM_PYTHON_PACKAGES } from "./packages/research/workbench/src/components.ts"; execFileSync(process.env.DSH_RESEARCH_TEST_PYTHON!, ["-m", "pip", "install", ...PLATFORM_PYTHON_PACKAGES], { stdio: "inherit" })'
          echo "DSH_RESEARCH_TEST_PYTHON=$DSH_RESEARCH_TEST_PYTHON" >> "$GITHUB_ENV"
      - run: pnpm run build:official
      - name: Refresh browser fixtures for review
        run: >-
          pnpm run test:web:built
          apps/web/tests/shortcuts-panels.e2e.ts
          apps/web/tests/markdown-wide-table.e2e.ts
          apps/web/tests/conversation-revision.e2e.ts
          apps/web/tests/preview-boot.e2e.ts
          --fileParallelism --maxWorkers=2
          --reporter=default --reporter=json
          --outputFile.json=.artifacts/browser-results.json
      - name: Capture fixture changes
        if: always()
        run: |
          git add -N -- apps/web/tests snapshots/web
          git diff --binary -- apps/web/tests snapshots/web > "$RUNNER_TEMP/browser-fixtures.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-fixtures-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/browser-fixtures.patch
            .artifacts/browser-results.json
            .artifacts/*.png
